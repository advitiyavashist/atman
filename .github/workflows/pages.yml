name: pages

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - docs/assets/demo/hero.gif
      - docs/assets/demo/poster.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copy demo assets into the published tree
        run: mkdir -p landing/assets/demo && cp docs/assets/demo/hero.gif docs/assets/demo/poster.png landing/assets/demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
