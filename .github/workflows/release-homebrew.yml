name: release-homebrew

# Tag -> tarball -> GitHub Release -> Homebrew formula bump PR (T-865).
#
# Needs, as repo/environment setup this workflow cannot create for itself:
#   - the tag pushed here to point at a commit already reviewed and merged
#     to main (this workflow does not gate that; `tickets review`/`merge` do);
#   - a HOMEBREW_TAP_TOKEN secret: a PAT with push access to
#     advitiyavashist/homebrew-tap, used only for the bump-PR step below.
# Until that secret exists the release/tarball/sha256 steps still run and
# publish the GitHub Release; only the tap PR step is skipped.
on:
  push:
    tags: ['v*']

jobs:
  release:
    # Creating the GitHub Release needs contents: write. Without it the job
    # built and smoke-tested the tarball and then died on the publish step with
    # "Resource not accessible by integration", which is what kept v0.2.0 from
    # ever appearing and left the Homebrew formula pointing at nothing.
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the release tarball
        id: build
        run: |
          # The redirect below is opened by the shell before the build script
          # runs, so dist/ has to exist first: without this the job died with
          # "dist/release.json: No such file or directory" and no release was
          # ever published (v0.2.0's first attempt).
          mkdir -p dist
          python3 scripts/build_release_tarball.py --ref "$GITHUB_REF_NAME" --outdir dist --json > dist/release.json
          python3 -c "
          import json
          r = json.load(open('dist/release.json'))
          print('tarball=%s' % r['tarball'])
          print('sha256=%s' % r['sha256'])
          print('version=%s' % r['version'])
          " >> "$GITHUB_OUTPUT"
      - name: Prove the tarball installs and passes the acceptance smoke
        run: |
          mkdir -p /tmp/atman-extract
          tar -xzf "${{ steps.build.outputs.tarball }}" -C /tmp/atman-extract
          # -mindepth 1 matters: without it the extract root itself
          # (/tmp/atman-extract) also matches 'atman-*', so EXTRACTED became two
          # newline-joined paths and python was handed a filename that cannot
          # exist. That is what failed the v0.2.0 release run.
          EXTRACTED=$(find /tmp/atman-extract -mindepth 1 -maxdepth 1 -type d -name 'atman-*' | head -1)
          python3 "$EXTRACTED/tickets.py" --version | grep -q 'verified release'
          TICKETS_DIR="$RUNNER_TEMP/board" TICKET_AGENT=release-ci HOME="$RUNNER_TEMP" \
            python3 "$EXTRACTED/tickets.py" join release-ci-seat --roles backend | grep -q 'joined as'
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.tarball }}
          fail_on_unmatched_files: true
      # T-1108 / v0.3.0: the local tarball hashed 410cf802... (662,834 bytes)
      # while the asset GitHub served hashed c125cb6f... (662,938 bytes).
      # Contents matched; only the gzip wrapper differed. Homebrew must pin
      # the bytes `brew` downloads, not the file we just built.
      - name: Hash the published GitHub Release asset
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: atman-${{ steps.build.outputs.version }}.tar.gz
        run: |
          mkdir -p /tmp/published
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir /tmp/published
          python3 -c "
          import hashlib, os, pathlib
          path = pathlib.Path('/tmp/published') / os.environ['ASSET']
          print('sha256=%s' % hashlib.sha256(path.read_bytes()).hexdigest())
          " >> "$GITHUB_OUTPUT"
      - name: Bump the tap formula
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/advitiyavashist/homebrew-tap.git" /tmp/tap
          BRANCH="bump-atman-${{ steps.build.outputs.version }}"
          cd /tmp/tap
          git checkout -b "$BRANCH"
          sed -i.bak \
            -e "s|^  url \".*atman-.*\.tar\.gz\"|  url \"https://github.com/advitiyavashist/atman/releases/download/${GITHUB_REF_NAME}/atman-${{ steps.build.outputs.version }}.tar.gz\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${{ steps.published.outputs.sha256 }}\"|" \
            Formula/atman.rb
          rm -f Formula/atman.rb.bak
          git -c user.name="atman-release-bot" -c user.email="release@atman.dev" \
            commit -am "atman ${{ steps.build.outputs.version }} (${GITHUB_REF_NAME})" \
            Formula/atman.rb
          git push origin "$BRANCH"
          gh pr create --repo advitiyavashist/homebrew-tap \
            --title "atman ${{ steps.build.outputs.version }}" \
            --body "Automated bump from advitiyavashist/atman@${GITHUB_REF_NAME}. Published-asset sha256 ${{ steps.published.outputs.sha256 }}." \
            --head "$BRANCH" --base main
        shell: bash
