[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickets"
version = "1.0.0"
description = "Standalone multi-agent ticket board CLI (extracted and hardened from Steer)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Advitiya Vashist" }]
keywords = ["tickets", "multi-agent", "cli", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tickets = "tickets.cli:main"

[project.urls]
Homepage = "https://github.com/advitiyavashist/tickets"
Source = "https://github.com/advitiyavashist/tickets"
Upstream = "https://github.com/advitiyavashist/steer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
