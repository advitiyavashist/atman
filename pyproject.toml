[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-board"
version = "0.3.0"
description = "File-based multi-agent ticket board CLI (safe clear + board backup)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Atman contributors" }]

[project.optional-dependencies]
# Needed to run tests/test_contracts.py (T-178 fixture pack vs
# docs/contracts/openapi.yaml) and tests/test_t1034_demo_provenance.py
# (Pillow decodes the published gif/poster). CI installs this extra.
contracts = ["pytest>=7", "jsonschema>=4.18", "pyyaml>=6", "pillow"]

[project.scripts]
atm = "ticket_board.cli:main"
tickets = "ticket_board.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Each full suite run leaves 150-350MB of git-repo fixtures under the
# session basetemp; default retention (3 newest per basetemp per process)
# multiplies that across parallel lanes until the volume fills (T-413/T-414).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# Repo root on sys.path so tests/runner_helpers.py is importable as
# tests.runner_helpers when several test dirs are collected together (T-544).
pythonpath = [".", "src"]
