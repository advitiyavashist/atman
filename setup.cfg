# pip 21 copies the tree and can miss PEP 621 metadata, producing UNKNOWN-0.0.0.
# Keep this aligned with pyproject.toml so a clean wheel still names ticket-board.
[metadata]
name = ticket-board
version = 0.3.0
description = File-based multi-agent ticket board CLI (safe clear + board backup)
author = Atman contributors
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
py_modules =
    tickets
    session_adapters
    auth_v2_contract
    quota_adapters

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    atm = tickets:main
    tickets = tickets:main
