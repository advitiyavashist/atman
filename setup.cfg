# pip 21 copies the tree and can miss PEP 621 metadata, producing UNKNOWN-0.0.0.
# Keep this aligned with pyproject.toml so a clean wheel still names ticket-board.
[metadata]
name = ticket-board
version = 0.2.0
description = File-based multi-agent ticket board CLI (safe clear + board backup)
author = Atman contributors
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    tickets = ticket_board.cli:main
