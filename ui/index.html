<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>atman</title>
    <!--
      An inline icon, so the browser stops asking for /favicon.ico (which this
      server has no file for) on every load. A data URI keeps it in the page:
      no request, and nothing fetched from anywhere but this process.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e1014'/%3E%3Cpath d='M4 11.5 8 4l4 7.5' stroke='%236aa9ff' stroke-width='1.6' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!--
      When `atm ui` serves this file at /app/ it inserts two meta tags,
      atman-token and atman-api, just before the closing head tag. The page
      reads them from there; the token never travels in a URL.

      Nothing in this head may spell the closing head tag inside a comment:
      both vite's asset injection and atm ui's meta insertion cut at the first
      occurrence of it in the file, and would land inside the comment.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
