<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>atman · app v3 mockup</title>
<style>
/* ---- tokens (docs/design/app-v3.md §8) ---- */
:root{
  color-scheme:light;
  --paper:#f7f7f5; --card:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e0; --line-strong:#cfcfca;
  --accent:#2f5bea; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --working:#1f8a4c; --needs:#b7791f; --blocked:#c53030; --done:#6b6b6b; --next:#8a8a86;
  --needs-soft:#fbf3e3; --blocked-soft:#fbeaea; --working-soft:#e6f4ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--paper:#121212;--card:#1c1c1c;--ink:#ececea;--muted:#9a9a96;--line:#2a2a28;--line-strong:#3a3a37;
    --accent:#6f8ff5;--accent-ink:#0e1220;--accent-soft:#1d2540;--needs-soft:#2b2412;--blocked-soft:#2e1818;--working-soft:#132b1d;--done:#9a9a96;--next:#8a8a86}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
code,.mono{font-family:var(--mono);font-size:12.5px}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---- mockup-only state bar ---- */
.mock{background:#262626;color:#d8d8d4;font-size:12px;padding:6px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mock b{color:#fff;letter-spacing:.06em;text-transform:uppercase;font-size:11px;margin-right:6px}
.mock button{background:transparent;border:1px solid #4a4a4a;color:#d8d8d4;border-radius:6px;padding:2px 8px;cursor:pointer}
.mock button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}

/* ---- top bar ---- */
.top{height:48px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wordmark{font-weight:700;letter-spacing:-.01em;font-size:15px}
.project{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:8px;padding:4px 10px;background:var(--card);cursor:pointer}
.project .chev{color:var(--muted);font-size:11px}
.top .spacer{flex:1}
.you{color:var(--muted)}
.you b{color:var(--ink);font-weight:600}
.readonly{color:var(--needs)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--muted)}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--line-strong);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:left .15s}
body.show-details .switch i{background:var(--accent)}
body.show-details .switch i::after{left:14px}
body.show-details .switch{color:var(--ink)}
.details{display:none}
body.show-details .details{display:block}
.details.inline{display:none}
body.show-details .details.inline{display:inline}

/* ---- objective ---- */
.objective{padding:20px 20px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.objective .row{max-width:1260px;margin:0 auto;display:flex;gap:24px;align-items:flex-start}
.objective h1{margin:0;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.objective .when{margin:4px 0 0;color:var(--muted)}
.objective .when.warn{color:var(--needs)}
.objective .grow{flex:1;min-width:0}
.progress{min-width:170px;text-align:right}
.progress .n{font-weight:600}
.progress .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--working);border-radius:2px}
.objective .you-mobile{display:none;color:var(--muted);margin-top:6px}

/* ---- layout ---- */
.layout{max-width:1260px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;padding:20px 20px 60px}
.main{max-width:880px;min-width:0}
.talk{position:sticky;top:68px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 88px)}

/* ---- strip ---- */
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font-weight:500}
.pill i{width:8px;height:8px;border-radius:4px;background:var(--next)}
.pill.working i{background:var(--working)} .pill.needs i{background:var(--needs)} .pill.blocked i{background:var(--blocked)} .pill.done i{background:var(--done)}
.pill.zero{color:var(--muted);font-weight:400}
.pill.zero i{opacity:.35}
.pill.hot{border-color:var(--needs);background:var(--needs-soft)}

/* ---- presence strip (§5.8) ---- */
.presence{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;margin:0 0 24px 4px;color:var(--muted);font-size:13px}
.seat{all:unset;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border-radius:6px;padding:2px 4px}
.seat:hover{background:var(--card);color:var(--ink)}
.seat b{font-weight:600;color:var(--ink)}
.seat .doing{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;position:relative;box-sizing:border-box}
.dot.working{background:var(--working)}
.dot.idle{border:1.5px solid var(--muted)}
.dot.offline{border:1.5px solid var(--muted)}
.dot.offline::after{content:"";position:absolute;left:-2px;top:2.5px;width:11px;height:1.5px;background:var(--muted);transform:rotate(-45deg)}
.dot.limited{background:var(--needs)}
.dot.logged-out{border:1.5px solid var(--needs)}
.dot.unknown{border:1.5px dotted var(--muted)}
.dot.unknown::after{content:"?";position:absolute;left:0;right:0;top:-1px;font-size:7px;line-height:8px;text-align:center;color:var(--muted);font-weight:700}
.seat.me{cursor:default}
.seat.me:hover{background:transparent;color:var(--muted)}

/* ---- sections ---- */
section{margin-bottom:28px}
section h2{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
section h2 span{color:var(--ink)}
section h2 .fold{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
section h2 .fold::before{content:"▸";font-size:10px;color:var(--muted)}
section.open h2 .fold::before{content:"▾"}
section h2 .fold:hover{color:var(--ink)}
.chips{display:inline-flex;gap:4px;text-transform:none;letter-spacing:0;font-weight:500}
.chip{all:unset;cursor:pointer;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:hover:not([aria-pressed=true]){border-color:var(--line-strong);color:var(--ink)}
.chip .n{opacity:.7}
.empty{color:var(--muted);padding:12px 16px;border:1px dashed var(--line-strong);border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.empty .grow{flex:1 1 240px}
.cards{display:flex;flex-direction:column;gap:8px}

/* ---- card ---- */
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--next);border-radius:10px;padding:14px 16px;box-shadow:0 1px 1px rgba(0,0,0,.02);cursor:pointer}
.card:hover{border-color:var(--line-strong);border-left-color:inherit}
.card.working{border-left-color:var(--working)} .card.needs{border-left-color:var(--needs)} .card.blocked{border-left-color:var(--blocked)} .card.done{border-left-color:var(--done)}
.card.working:hover{border-left-color:var(--working)} .card.needs:hover{border-left-color:var(--needs)} .card.blocked:hover{border-left-color:var(--blocked)} .card.done:hover{border-left-color:var(--done)}
.card .head{display:flex;gap:10px;align-items:baseline}
.card .id{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.card .title{font-weight:600;font-size:15px;flex:1;min-width:0}
.card .open{all:unset;cursor:pointer;color:var(--muted);flex:none;font-size:13px}
.card .open:hover{color:var(--ink)}
.card .sentence{margin:6px 0 0;line-height:1.5}
.card .sentence q{quotes:"“" "”"}
.card .sub{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px 10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.card .details{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px;line-height:1.6}
.item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--needs);border-radius:10px;padding:14px 16px}
.item .who{font-weight:600}
.item .text{margin:4px 0 0}
.why{color:var(--needs);font-size:13px}
.result{display:block;color:var(--muted);font-size:13px;margin-top:12px}
.result::before{content:"✓";color:var(--working);font-weight:700;margin-right:6px}
.result code{color:var(--ink)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--blocked);border-color:var(--blocked)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--paper)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line-strong);filter:none}
.btn .sha{font-family:var(--mono);font-weight:400;opacity:.9}

/* ---- ticket badge in chat (§5.9) ---- */
.badge{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:12px;vertical-align:middle;white-space:nowrap}
.badge:hover{border-color:var(--line-strong)}
.badge .id{font-family:var(--mono);color:var(--ink)}
.badge .st{color:var(--muted)}
.badge i{width:6px;height:6px;border-radius:3px;background:var(--next)}
.badge.working i{background:var(--working)} .badge.needs i{background:var(--needs)} .badge.blocked i{background:var(--blocked)} .badge.done i{background:var(--done)}

/* ---- talk ---- */
.talk .th{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.talk .th .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.talk .who{display:flex;align-items:center;gap:8px;margin-top:6px}
.talk .who select{font:inherit;font-weight:600;font-size:15px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px 2px 0;cursor:pointer;color:var(--ink);max-width:100%}
.talk .who select:hover{border-color:var(--line-strong)}
.talk .state{color:var(--muted);margin-top:2px}
.talk .state.on{color:var(--working)} .talk .state.warn{color:var(--needs)}
.talk .note{margin:10px 0 0;padding:10px 12px;background:var(--paper);border-radius:8px;color:var(--muted);line-height:1.5}
.talk .note .btn{margin-top:8px}
.thread{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.msg .meta{display:flex;gap:8px;align-items:baseline;color:var(--muted);font-size:12.5px}
.msg .meta b{color:var(--ink);font-weight:600;font-size:13px}
.msg .body{margin:2px 0 0;white-space:pre-wrap;line-height:1.6}
.msg.me .body{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.msg .re{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.msg .receipts{font-size:11.5px;color:var(--muted);margin-top:3px}
.msg .receipts span{border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px}
.thread .empty-t{color:var(--muted);text-align:center;margin:auto}
.composer{border-top:1px solid var(--line);padding:12px 16px;position:relative}
.composer textarea{width:100%;min-height:64px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical;background:var(--card);color:var(--ink)}
.composer .hint{margin:4px 2px 0;font-size:12px;color:var(--muted)}
.composer .row{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted)}
.composer select{font:inherit;border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;background:var(--card);color:var(--ink)}
.composer .grow{flex:1}
.composer .draft{font-size:12px;color:var(--muted)}
/* autocomplete popover (§5.6) */
.ac{position:absolute;left:16px;right:16px;bottom:calc(100% - 8px);background:var(--card);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);z-index:12;padding:4px;max-height:220px;overflow:auto}
.ac .opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.ac .opt .k{font-family:var(--mono);font-size:12px;color:var(--ink)}
.ac .opt .d{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac .opt[aria-selected=true]{background:var(--accent-soft)}
.ac .cap{font-size:11px;color:var(--muted);padding:4px 8px 2px;letter-spacing:.06em;text-transform:uppercase}

/* ---- ticket panel (§5.9) ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--card);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .18s ease-out}
.panel .handle{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:2}
.panel .handle::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:transparent}
.panel .handle:hover::after,.panel.dragging .handle::after{background:var(--accent)}
.panel .scroll{overflow:auto;padding:20px 24px 24px;flex:1}
.panel .back{all:unset;cursor:pointer;color:var(--muted);margin-bottom:12px;display:inline-block}
.panel h3{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.panel .id{font-family:var(--mono);color:var(--muted);font-size:12px}
.panel .sentence{margin:10px 0 0;font-size:15px}
.panel .actions{margin:14px 0 6px}
.panel h4{margin:22px 0 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel p{margin:0 0 6px;line-height:1.5}
.panel .body{white-space:pre-wrap;color:var(--ink)}
.panel .proof{padding:10px 12px;background:var(--paper);border-radius:8px}
.panel .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px}
.panel .kv dt{color:var(--muted)} .panel .kv dd{margin:0;word-break:break-all}
.panel .pthread{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.panel .pthread .msg .body{background:transparent;padding:0}
.panel .pthread .msg.me .body{background:var(--accent-soft);padding:8px 10px}
.panel .composer{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.panel .composer .ac{left:12px;right:12px}
.verdict{border-left:3px solid var(--line-strong);padding:6px 10px;margin:6px 0}
.verdict.accept{border-color:var(--working)} .verdict.reject{border-color:var(--blocked)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* ---- dialogs ---- */
.dlg{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:520px;max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:31;padding:20px 22px}
.dlg h3{margin:0 0 4px;font-size:17px;font-weight:600}
.dlg .lede{color:var(--muted);margin:0 0 14px;line-height:1.5}
.dlg label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.dlg input,.dlg textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;background:var(--card);color:var(--ink)}
.dlg textarea{min-height:72px;resize:vertical}
.dlg .shabox{font-family:var(--mono);font-size:12.5px;background:var(--paper);border-radius:8px;padding:8px 10px;word-break:break-all}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center;flex-wrap:wrap}
.dlg .foot .why{flex:1 1 200px}
.dlg .stale{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;padding:10px 12px;border:1px solid var(--needs);background:var(--needs-soft);border-radius:8px;color:var(--ink)}
.dlg .stale .t{flex:1 1 220px}
.dlg .seat-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer}
.dlg .seat-row input{width:auto}
.dlg .seat-row .st{color:var(--muted);font-size:12.5px;margin-left:auto}
.dlg .seat-row .st.warn{color:var(--needs)}
.dlg .cmd{display:flex;gap:8px;align-items:center;background:var(--paper);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12.5px;margin-top:8px}
.dlg .cmd span{flex:1}
.dlg .cmd button{all:unset;cursor:pointer;color:var(--accent);font-family:var(--sans);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#262626;color:#fff;padding:10px 14px;border-radius:10px;z-index:40;font-size:13px;max-width:calc(100% - 24px);box-shadow:var(--shadow)}
.toast code{color:#ffd88a;font-size:12px}

/* ---- phone ---- */
.seg{display:none}
@media (max-width:960px){
  .top{padding:0 14px;gap:10px}
  .you{display:none}
  .objective{padding:16px 14px 12px}
  .objective .row{display:block}
  .objective .you-mobile{display:block}
  .progress{min-width:0;text-align:left;margin-top:8px}
  .progress .bar{max-width:220px}
  .layout{display:block;padding:14px 14px 60px}
  .main{max-width:none}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--card)}
  .seg button{all:unset;text-align:center;padding:8px;cursor:pointer;font-weight:500;position:relative}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .seg button .dot{position:absolute;top:8px;margin-left:6px;width:7px;height:7px;border-radius:4px;background:var(--needs);border:0}
  .talk{position:static;max-height:none;min-height:60vh}
  body[data-tab=board] .talk{display:none}
  body[data-tab=talk] .main{display:none}
  .strip{gap:6px}
  .pill{padding:5px 10px 5px 8px;font-size:13px}
  .presence{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:20px}
  .seat .doing{max-width:calc(100vw - 140px)}
  .card{padding:12px 12px}
  .card .head{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .card .id{grid-column:1;grid-row:1}
  .card .open{grid-column:2;grid-row:1;margin:0}
  .card .title{grid-column:1/-1}
  .card .open{margin-left:auto}
  .panel{width:100%!important;border-left:0}
  .panel .handle{display:none}
  .panel .scroll{padding:16px 14px 40px}
  .dlg{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-width:100%;border-radius:14px 14px 0 0}
}
</style>
</head>
<body data-tab="board">

<div class="mock" id="mockbar"><b>Mockup · state</b></div>

<header class="top">
  <span class="wordmark">atman</span>
  <span class="project" title="Project switcher: every board in ~/.config/atman/board.json">demo <span class="chev">▾</span></span>
  <span class="spacer"></span>
  <span class="you" id="you"></span>
  <label class="switch" title="Show paths, transcripts, receipts, limits and phases"><i></i><span id="detailsLabel">Details</span><input type="checkbox" id="detailsToggle" hidden></label>
</header>

<div class="objective" id="objective"></div>

<div class="layout">
  <div class="seg" id="seg">
    <button aria-pressed="true" data-tab="board">Board</button>
    <button aria-pressed="false" data-tab="talk">Talk<span class="dot hidden" id="talkDot"></span></button>
  </div>
  <div class="main" id="main">
    <div class="strip" id="strip"></div>

/* ===================================================================== */
let S, stateKey = "fresh", talkWith = null, aboutId = null;  // aboutId null = not chosen yet: defaults to the ticket the seat is running (§5.6)
let needsFilter = "all";            // §5.10, session only
let results = {};                   // §6.1: id -> result line after an action ran (until the next board read)
let panelId = null;                 // §5.9
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = s => s.slice(0,7);
const q = new URLSearchParams(location.search);
const store = {
  get(k, d){ try { const v = localStorage.getItem("app-v3." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("app-v3." + k, JSON.stringify(v)); } catch (e) {} },
};
const READONLY_WHY = "Read-only. Start with atm ui --operator <name> to act.";

/* ---------- presence (§5.8) ---------- */
function presenceOf(a){
  if (a.state === "working") return {k:"working", words: doingNow(a), why:""};
  if (a.state === "limited") return {k:"limited", words:`limited until ${a.until}`, why:`Provider quota; resets ${a.until}. Nothing runs on it until then.`};
  if (a.state === "logged-out") return {k:"logged-out", words:"logged out", why:`atm harness auth ${a.name}`};
  if (a.reachable === false) return {k:"offline", words:"host offline", why:a.reason || "Adapter offline; directed work will remain queued."};
  if (a.seen == null && a.reachable == null) return {k:"unknown", words:"unknown", why:"No liveness record for this seat. Never seen by this board."};
  return {k:"idle", words:`idle ${a.seen}`, why:`Reachable, nothing claimed. Last seen ${a.seen} ago.`};
}
function doingNow(a){
  const t = S.tickets.find(x => x.id === a.ticket);
  if (!t) return `running ${a.ticket}`;
  if (!t.lastNote) return `running ${t.id}, no update yet`;
  const clause = t.lastNote.split(/[;:.]/)[0].trim();
  return `${clause} for ${t.id}`;
}
function seatState(a){
  if (!a) return "";
  if (a.state === "working") return `running ${a.ticket} for ${a.elapsed}`;
  if (a.state === "limited") return `limited until ${a.until}`;
  if (a.state === "logged-out") return `logged out · atm harness auth ${a.name}`;
  if (a.reachable === false) return "not running · host offline";
  if (a.seen == null) return "not running · never seen";
  return `idle since ${a.seen}`;
}
function renderPresence(){
  const seats = S.agents.map(a => { const p = presenceOf(a); return `<button class="seat" data-act="talk:${a.name}" title="${esc(p.why || seatState(a))}"><span class="dot ${p.k}"></span><b>${esc(a.name)}</b><span>·</span><span class="doing">${esc(p.words)}</span></button>`; });
  if (S.operator) seats.push(`<span class="seat me"><span class="dot working"></span><b>${esc(S.operator)}</b><span>(you)</span></span>`);
  $("#presence").innerHTML = seats.join("");
}

/* one sentence per card (spec §5.3) */
function sentence(t){
  const opIsOwner = t.owner && t.owner === S.operator;
  switch (t.phase){
    case "working": return `${t.owner} has it, running for ${t.running}.`;
    case "claimed": return `${t.owner} has it, last update ${t.ago} ago.`;
    case "review": return opIsOwner ? `You finished it ${t.finished} ago. Another seat has to accept it.` : `${t.owner} finished it ${t.finished} ago. Waiting for your accept.`;
    case "ready": return `Nobody has it. Ready to start.`;
    case "waiting": {
      if (t.onState === "review") return `Nobody has it. Waits on ${t.on}, which is in review.`;
      if (t.onState === "blocked") return `Nobody has it. Waits on ${t.on}, which is blocked.`;
      if (t.onState === "done-unaccepted") return `Waits on ${t.on}, which is done but not accepted.`;
      return `Nobody has it. Waits on ${t.on}.`;
    }
    case "blocked": return `Blocked by ${t.owner} ${t.ago} ago: <q>${esc(t.reason)}</q>`;
    case "limited": return `${t.owner} is limited until ${t.until}. Nothing runs on it until then.`;
    case "offline": return `${t.owner} has no live session. It picks this up when started.`;
    case "done": return t.accepted ? `Accepted by ${t.by} ${t.ago} ago on <code>${short(t.sha)}</code>.` : `Marked done by ${t.owner} ${t.ago} ago. Not accepted yet.`;
  }
  return "";
}
function bucket(t){
  if (t.phase === "review") return "needs";
  if (t.phase === "working" || t.phase === "claimed") return "working";
  if (t.phase === "blocked" || t.phase === "limited" || t.phase === "offline") return "blocked";
  if (t.phase === "done") return "done";
  return "next";
}
function phaseWord(t){
  if (!t) return "";
  switch (t.phase){
    case "review": return "in review"; case "working": case "claimed": return "working"; case "ready": return "ready";
    case "waiting": return "waits on " + t.on; case "blocked": return "blocked"; case "limited": return "seat limited"; case "offline": return "seat offline";
    case "done": return t.accepted ? "accepted" : "done, not accepted";
  }
  return t.phase;
}
function counts(){
  const c = {working:0, needs:0, blocked:0, done:0, unaccepted:0};
  for (const t of S.tickets){
    const b = bucket(t);
    if (b === "working") c.working++;
    if (b === "needs") c.needs++;
    if (b === "blocked") c.blocked++;
    if (b === "done") { if (t.accepted) c.done++; else c.unaccepted++; }
  }
  c.needs += S.needs.length;
  return c;
}
function canAct(){ return !!S.operator; }

/* ---------- button model (§6.1): one verb per button, a visible reason when disabled, a result line after it ran ---------- */
function btn(label, cls, act, opts={}){
  const dis = opts.disabled || !canAct();
  return `<button class="btn ${cls||""}" ${dis?"disabled":""} ${opts.why?`aria-describedby="why-${act.replace(/[^a-z0-9]/gi,"")}"`:""} data-act="${act}">${label}</button>`;
}
function row(buttons, whys=[]){
  if (!buttons.length) return "";
  const reasons = canAct() ? whys.filter(Boolean) : [READONLY_WHY];
  const seen = new Set(); const uniq = reasons.filter(r => !seen.has(r) && seen.add(r));
  return `<div class="actions">${buttons.join("")}${uniq.map(r => `<span class="why">${esc(r)}</span>`).join("")}</div>`;
}
function resultLine(id){ return results[id] ? `<div class="result" data-result="${id}">${results[id]}</div>` : ""; }

/* ---------- ticket badges wherever chat mentions a ticket (§5.9) ---------- */
function rich(text){
  return esc(text).replace(/#?\b(T-\d{3})\b/g, (m, id) => {
    const t = ticket(id); if (!t) return m;               // not on this board: plain text
    return `<button class="badge ${bucket(t)}" data-act="open:${id}" title="${esc(t.title)}"><i></i><span class="id">${id}</span><span class="st">${esc(phaseWord(t))} · ${esc(t.owner || t.by || "nobody")}</span></button>`;
  });
}

/* ---------- render ---------- */
function render(){
  S = STATES[stateKey];
  document.body.classList.toggle("readonly", !canAct());
  $("#you").innerHTML = canAct() ? `You are <b>${esc(S.operator)}</b>` : `<span class="readonly">Read-only. Start with <code>atm ui --operator &lt;name&gt;</code> to act.</span>`;
  const c = counts();
  const total = S.tickets.length;
  const o = $("#objective");
  if (!S.objective){
    o.innerHTML = `<div class="row"><div class="grow"><h1 class="muted" style="font-weight:500">No objective yet. Say what this board is for.</h1>
      <p class="when">${btn("Set objective…","", "set-objective")}</p>
      <p class="you-mobile">${canAct()?`You are <b>${esc(S.operator)}</b>`:"Read-only"}</p></div></div>`;
  } else {
    const pct = total ? Math.round(100*c.done/total) : 0;
    o.innerHTML = `<div class="row"><div class="grow"><h1>${esc(S.objective.text)}</h1>
      <p class="when ${S.objective.exit?"":"warn"}">${S.objective.exit ? "Done when "+esc(S.objective.exit) : 'No "done when" set yet.'}${S.objective.exit?"":'<span class="details inline muted"> · <code>atm objective --exit "…"</code></span>'}</p>
      <p class="you-mobile">${canAct()?`You are <b>${esc(S.operator)}</b>`:"Read-only"}</p></div>
      <div class="progress"><span class="n">${c.done} of ${total} accepted</span>${c.unaccepted?`<span class="muted"> · ${c.unaccepted} done, not accepted</span>`:""}<div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
  }
  const pill = (k, n, label) => `<a class="pill ${k} ${n?"":"zero"} ${k==="needs"&&n?"hot":""}" href="#sec-${k}"><i></i>${n} ${label}</a>`;
  $("#strip").innerHTML = pill("working", c.working, "working") + pill("needs", c.needs, "needs you") + pill("blocked", c.blocked, "blocked") + pill("done", c.done, "done");
  renderPresence();
  $("#talkDot").classList.toggle("hidden", !(S.messages.length && S.messages[S.messages.length-1].from !== S.operator));
  const secs = $("#sections");
  if (!S.tickets.length){
    secs.innerHTML = `<div class="empty"><span class="grow">This board has no tickets. Add work with <code>atm plan</code> or <code>atm create</code>.</span>${btn("Create ticket…","", "create-ticket")}</div>`;
  } else {
    const by = {needs:[], working:[], blocked:[], next:[], done:[]};
    for (const t of S.tickets) by[bucket(t)].push(t);
    secs.innerHTML =
      needsSection(by.needs) +
      section("working", "Working", by.working.length, by.working.map(renderCard).join(""), "Nobody is working. Assign a ticket or start an agent.", btn("Assign…","primary", "assign:") + btn("Start an agent…","quiet","start")) +
      section("blocked", "Blocked", by.blocked.length, by.blocked.map(renderCard).join(""), "Nothing is blocked.") +
      section("next", "Up next", by.next.length, by.next.map(renderCard).join(""), "Nothing is queued.") +
      doneSection(by.done);
  }
  renderTalk();
  $("#detailsLabel").textContent = document.body.classList.contains("show-details") ? "Details on" : "Details";
  const boardDetails = $("#boardDetails") || document.createElement("p");
  boardDetails.id = "boardDetails"; boardDetails.className = "details muted"; boardDetails.style.cssText = "margin:-12px 0 20px;font-size:12.5px";
  boardDetails.innerHTML = `Board read 2 s ago · <code>&lt;repo&gt;/.tickets</code> · operator ${esc(S.operator||"none")} · plan generated 2026-09-24T13:35:12Z · seats: ${S.agents.map(a => `${esc(a.name)} ${esc(seatState(a))}${a.reason?` (${esc(a.reason)})`:""}`).join(" · ")}`;
  $("#sections").before(boardDetails);
  if (panelId) openPanel(panelId, true);
}
function section(key, title, n, inner, emptyCopy, emptyActions=""){
  return `<section id="sec-${key}"><h2>${title} <span>(${n})</span></h2>${n ? `<div class="cards">${inner}</div>` : `<div class="empty"><span class="grow">${emptyCopy}</span>${emptyActions}</div>`}</section>`;
}
/* Needs you with its four filters (§5.10) */
function needKind(n){ return n.kind === "question" ? "mentions" : "blocked"; }   // stuck / limited / stopped are "Blocked"
function needsSection(reviewCards){
  const items = S.needs.map(n => ({k:needKind(n), html:renderNeed(n)})).concat(reviewCards.map(t => ({k:"accept", html:renderCard(t)})));
  const n = items.length;
  const count = k => k === "all" ? n : items.filter(i => i.k === k).length;
  const chips = [["all","All"],["mentions","Mentions"],["accept","Accept"],["blocked","Blocked"]]
    .map(([k,l]) => `<button class="chip" aria-pressed="${needsFilter===k}" data-act="filter:${k}">${l}<span class="n">${count(k)}</span></button>`).join("");
  const shown = items.filter(i => needsFilter === "all" || i.k === needsFilter);
  const word = {mentions:"Mentions", accept:"Accept", blocked:"Blocked"}[needsFilter];
  const body = !n ? `<div class="empty"><span class="grow">Nothing needs you right now.</span></div>`
             : shown.length ? `<div class="cards">${shown.map(i => i.html).join("")}</div>`
             : `<div class="empty"><span class="grow">Nothing under ${word}.</span></div>`;

function cardActions(t){

}

/* ---------- autocomplete (§5.6) ---------- */

  return S.tickets.map(t => ({k:t.id, d:`${t.title} · ${phaseWord(t)} · ${t.owner||t.by||"nobody"}`, dot:bucket(t)})).filter(i => (i.k + " " + i.d).toLowerCase().includes(term));

  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.classList.contains("card") && e.target.closest("button, select, a, textarea, input, .actions, .details")) return;  // buttons on a card act for themselves
  e.stopPropagation();
  const [act, a1, a2] = el.dataset.act.split(":");
  switch (act){
    case "open": openPanel(a1); break;
    case "close": closeOverlay(); break;
    case "talk": focusComposer(a1, null); break;
    case "filter": needsFilter = a1; render(); break;
    case "fold": store.set("done-open", !store.get("done-open", false)); render(); break;
    case "accept": openAccept(a1); break;
    case "reject": openReject(a1); break;
    case "assign": openAssign(a1); break;
    case "start": openStart(); break;
    case "set-objective": openSetObjective(); break;
    case "create-ticket": openCreate(); break;
    case "message": closeOverlay(); focusComposer(a1, a2); break;
    case "answer": closeOverlay(); focusComposer(a1, a2); break;
    case "send": sendComposer(a1 || "composer"); break;
    case "review-again": { const t = ticket(a1); t.sha = t.serverSha; t.notes = t.serverNotes; t.finished = t.serverFinished; t.evidence = "review head submitted just now · no verdict yet"; delete t.serverSha; render(); openAccept(a1); break; }
    case "do-accept": { const t = ticket(a1); const n = $("#acceptNotes").value.trim(); if (!n){ $("#acceptNotes").focus(); return; }
      results[a1] = `Accepted · by ${esc(S.operator)} · <code>${short(t.sha)}</code>`; closeOverlay(); render();
      toast(`<code>POST /api/v1/ticket/${a1}/accept</code> {sha: ${short(t.sha)}…, notes} · gate: operator ≠ author, sha = submitted head`);
      nextBoardRead(() => { Object.assign(t, {phase:"done", accepted:true, by:S.operator, ago:"just now", proof:"Accept notes: " + n}); const d = ticket("T-002"); if (d && d.on === a1) d.onState = "open"; S.needs = S.needs.filter(x => x.re !== a1 || x.kind !== "question"); });
      break; }
    case "do-reject": { const t = ticket(a1); const r = $("#rejectReason").value.trim(); if (!r){ $("#rejectReason").focus(); return; }
      results[a1] = `Rejected · by ${esc(S.operator)} · <code>${short(t.sha)}</code> · back with ${esc(t.owner)}`; closeOverlay(); render();
      toast(`<code>POST /api/v1/ticket/${a1}/reject</code> {sha, reason} · returns ${a1} to its author as claimed`);
      nextBoardRead(() => { Object.assign(t, {phase:"claimed", ago:"just now"}); });
      break; }
    case "do-assign": { const seat = document.querySelector('input[name=seat]:checked')?.value; if (!seat){ $("#assignWhyNone").classList.remove("hidden"); return; }
      const id = a1 || $("#assignTicket")?.value; const t = ticket(id);
      results[id] = `Assigned · to ${esc(seat)} · by ${esc(S.operator)}`; closeOverlay(); render();
      toast(`<code>POST /api/v1/ticket/${id}/assign</code> {owner: ${seat}} (<code>atm assign ${id} --owner ${seat}</code>)`);
      nextBoardRead(() => { if (t) Object.assign(t, {phase:"claimed", owner:seat, ago:"just now"}); });
      break; }
    case "do-objective": closeOverlay(); toast(`Mockup: would <code>POST /api/v1/objective</code> (<code>atm objective --set … --exit …</code>)`); break;
    case "do-create": closeOverlay(); toast(`Mockup: would <code>POST /api/v1/ticket</code> (<code>atm create …</code>)`); break;
    case "copy": toast("Copied."); break;
  }
});
document.addEventListener("input", e => {
  const box = e.target; if (!(box instanceof HTMLTextAreaElement) || !box.closest(".composer")) return;
  acUpdate(box);
  const inPanel = box.id === "composer-panel";
  const to = inPanel ? (ticket(panelId)?.owner && ticket(panelId).owner !== S.operator ? ticket(panelId).owner : "everyone") : talkWith;
  saveDraft(to, inPanel ? panelId : aboutId, box.value);
  const d = box.closest(".composer").querySelector(".draft"); if (d) d.classList.toggle("hidden", !box.value);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if (ac){ acClose(); return; } closeOverlay(); return; }
  const box = e.target;
  if (!(box instanceof HTMLTextAreaElement) || !box.closest(".composer")) return;
  if (ac && ac.box === box){
    if (e.key === "ArrowDown"){ e.preventDefault(); ac.idx = (ac.idx + 1) % ac.items.length; acDraw(); return; }
    if (e.key === "ArrowUp"){ e.preventDefault(); ac.idx = (ac.idx - 1 + ac.items.length) % ac.items.length; acDraw(); return; }
    if (e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); acPick(ac.idx); return; }   // Enter picks; it never sends while the list is open
  }
  // Enter sends; Shift+Enter (or any modifier) keeps the default and adds a new line.
  // While an IME composition is active (isComposing, or the legacy keyCode 229), Enter belongs to the editor: nothing is sent.
  if (e.key === "Enter" && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey){
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault(); sendComposer(box.id);
  }
});
$("#detailsToggle").addEventListener("change", e => { document.body.classList.toggle("show-details", e.target.checked); $("#detailsLabel").textContent = e.target.checked ? "Details on" : "Details"; });
function syncSeg(){ for (const b of $("#seg").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.tab === document.body.dataset.tab)); }
$("#seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; document.body.dataset.tab = b.dataset.tab; syncSeg(); });

/* ---------- mock state bar ---------- */
const bar = $("#mockbar");
for (const [k, v] of Object.entries(STATES)){
  const b = document.createElement("button"); b.textContent = v.label; b.dataset.state = k;
  b.onclick = () => setState(k); bar.appendChild(b);
}
function setState(k){
  stateKey = k; talkWith = null; aboutId = null; results = {}; needsFilter = "all"; clearTimeout(readTimer); closeOverlay();
  for (const b of bar.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.state === k));
  render();
  history.replaceState(null, "", "?state=" + k + (document.body.classList.contains("show-details") ? "&details=1" : "") + (document.body.dataset.tab==="talk"?"&tab=talk":""));
}
if (q.get("details") === "1"){ document.body.classList.add("show-details"); $("#detailsToggle").checked = true; }
if (q.get("tab") === "talk"){ document.body.dataset.tab = "talk"; syncSeg(); }
if (q.get("bare") === "1") bar.classList.add("hidden");
if (q.get("done") === "1") store.set("done-open", true);
if (q.get("done") === "0") store.set("done-open", false);
setState(STATES[q.get("state")] ? q.get("state") : "fresh");
if (q.get("filter")){ needsFilter = q.get("filter"); render(); }
if (q.get("result")){ const [what, id] = q.get("result").split(":"); const t = ticket(id);
  if (t && what === "accept") results[id] = `Accepted · by ${esc(S.operator)} · <code>${short(t.sha)}</code>`;
  if (t && what === "reject") results[id] = `Rejected · by ${esc(S.operator)} · <code>${short(t.sha)}</code> · back with ${esc(t.owner)}`;
  if (t && what === "assign") results[id] = `Assigned · to worker · by ${esc(S.operator)}`;
  render(); }
if (q.get("open")) openPanel(q.get("open"));
if (q.get("dialog") === "accept") openAccept(q.get("open") || "T-001");
if (q.get("dialog") === "reject") openReject(q.get("open") || "T-001");
if (q.get("dialog") === "assign") openAssign(q.get("open") || "");
if (q.get("dialog") === "start") openStart();
if (q.get("ac")){ const id = q.get("open") ? "composer-panel" : "composer"; const box = document.getElementById(id); if (box){ box.value = q.get("ac"); box.focus(); box.selectionStart = box.selectionEnd = box.value.length; acUpdate(box); } }
</script>
</body>
