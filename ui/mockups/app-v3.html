<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>atman · app v3 mockup</title>
<style>
/* ---- tokens (docs/design/app-v3.md §8) ---- */
:root{
  color-scheme:light;
  --paper:#f7f7f5; --card:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e0; --line-strong:#cfcfca;
  --accent:#2f5bea; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --working:#1f8a4c; --needs:#b7791f; --blocked:#c53030; --done:#6b6b6b; --next:#8a8a86;
  --needs-soft:#fbf3e3; --blocked-soft:#fbeaea; --working-soft:#e6f4ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--paper:#121212;--card:#1c1c1c;--ink:#ececea;--muted:#9a9a96;--line:#2a2a28;--line-strong:#3a3a37;
    --accent:#6f8ff5;--accent-ink:#0e1220;--accent-soft:#1d2540;--needs-soft:#2b2412;--blocked-soft:#2e1818;--working-soft:#132b1d;--done:#9a9a96;--next:#8a8a86}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
code,.mono{font-family:var(--mono);font-size:12.5px}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---- mockup-only state bar ---- */
.mock{background:#262626;color:#d8d8d4;font-size:12px;padding:6px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mock b{color:#fff;letter-spacing:.06em;text-transform:uppercase;font-size:11px;margin-right:6px}
.mock button{background:transparent;border:1px solid #4a4a4a;color:#d8d8d4;border-radius:6px;padding:2px 8px;cursor:pointer}
.mock button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}

/* ---- top bar ---- */
.top{height:48px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wordmark{font-weight:700;letter-spacing:-.01em;font-size:15px}
.project{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:8px;padding:4px 10px;background:var(--card);cursor:pointer}
.project .chev{color:var(--muted);font-size:11px}
.top .spacer{flex:1}
.you{color:var(--muted)}
.you b{color:var(--ink);font-weight:600}
.readonly{color:var(--needs)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--muted)}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--line-strong);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:left .15s}
body.show-details .switch i{background:var(--accent)}
body.show-details .switch i::after{left:14px}
body.show-details .switch{color:var(--ink)}
.details{display:none}
body.show-details .details{display:block}
.details.inline{display:none}
body.show-details .details.inline{display:inline}

/* ---- objective ---- */
.objective{padding:20px 20px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.objective .row{max-width:1260px;margin:0 auto;display:flex;gap:24px;align-items:flex-start}
.objective h1{margin:0;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.objective .when{margin:4px 0 0;color:var(--muted)}
.objective .when.warn{color:var(--needs)}
.objective .grow{flex:1;min-width:0}
.progress{min-width:170px;text-align:right}
.progress .n{font-weight:600}
.progress .bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--working);border-radius:2px}
.objective .you-mobile{display:none;color:var(--muted);margin-top:6px}

/* ---- layout ---- */
.layout{max-width:1260px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;padding:20px 20px 60px}
.main{max-width:880px;min-width:0}
.talk{position:sticky;top:68px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 88px)}

/* ---- strip ---- */
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font-weight:500}
.pill i{width:8px;height:8px;border-radius:4px;background:var(--next)}
.pill.working i{background:var(--working)} .pill.needs i{background:var(--needs)} .pill.blocked i{background:var(--blocked)} .pill.done i{background:var(--done)}
.pill.zero{color:var(--muted);font-weight:400}
.pill.zero i{opacity:.35}
.pill.hot{border-color:var(--needs);background:var(--needs-soft)}

/* ---- sections ---- */
section{margin-bottom:28px}
section h2{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
section h2 span{color:var(--ink)}
.empty{color:var(--muted);padding:12px 16px;border:1px dashed var(--line-strong);border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.empty .grow{flex:1 1 240px}
.cards{display:flex;flex-direction:column;gap:8px}

/* ---- card ---- */
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--next);border-radius:10px;padding:14px 16px;box-shadow:0 1px 1px rgba(0,0,0,.02)}
.card.working{border-left-color:var(--working)} .card.needs{border-left-color:var(--needs)} .card.blocked{border-left-color:var(--blocked)} .card.done{border-left-color:var(--done)}
.card .head{display:flex;gap:10px;align-items:baseline}
.card .id{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.card .title{font-weight:600;font-size:15px;flex:1;min-width:0}
.card .title button{all:unset;cursor:pointer}
.card .title button:hover{text-decoration:underline}
.card .open{all:unset;cursor:pointer;color:var(--muted);flex:none;font-size:13px}
.card .open:hover{color:var(--ink)}
.card .sentence{margin:6px 0 0;line-height:1.5}
.card .sentence q{quotes:"“" "”"}
.card .sub{margin:4px 0 0;color:var(--muted)}
.card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card .details{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px;line-height:1.6}
.item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--needs);border-radius:10px;padding:14px 16px}
.item .who{font-weight:600}
.item .text{margin:4px 0 0}
.item .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--blocked);border-color:var(--blocked)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--paper)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line-strong);filter:none}
.btn .sha{font-family:var(--mono);font-weight:400;opacity:.9}

/* ---- talk ---- */
.talk .th{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.talk .th .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.talk .who{display:flex;align-items:center;gap:8px;margin-top:6px}
.talk .who select{font:inherit;font-weight:600;font-size:15px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px 2px 0;cursor:pointer;color:var(--ink);max-width:100%}
.talk .who select:hover{border-color:var(--line-strong)}
.talk .state{color:var(--muted);margin-top:2px}
.talk .state.on{color:var(--working)} .talk .state.warn{color:var(--needs)}
.talk .note{margin:10px 0 0;padding:10px 12px;background:var(--paper);border-radius:8px;color:var(--muted);line-height:1.5}
.talk .note .btn{margin-top:8px}
.thread{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.msg .meta{display:flex;gap:8px;align-items:baseline;color:var(--muted);font-size:12.5px}
.msg .meta b{color:var(--ink);font-weight:600;font-size:13px}
.msg .body{margin:2px 0 0;white-space:pre-wrap;line-height:1.5}
.msg.me .body{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.msg .re{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.msg .receipts{font-size:11.5px;color:var(--muted);margin-top:3px}
.msg .receipts span{border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px}
.thread .empty-t{color:var(--muted);text-align:center;margin:auto}
.composer{border-top:1px solid var(--line);padding:12px 16px}
.composer textarea{width:100%;min-height:64px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical;background:var(--card);color:var(--ink)}
.composer .row{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted)}
.composer select{font:inherit;border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;background:var(--card);color:var(--ink)}
.composer .grow{flex:1}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--card);border-left:1px solid var(--line);z-index:21;overflow:auto;box-shadow:var(--shadow);padding:20px 24px 40px;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .back{all:unset;cursor:pointer;color:var(--muted);margin-bottom:12px;display:inline-block}
.sheet h3{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.sheet .id{font-family:var(--mono);color:var(--muted);font-size:12px}
.sheet .sentence{margin:10px 0 0;font-size:15px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.sheet h4{margin:18px 0 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:0 0 6px;line-height:1.5}
.sheet .body{white-space:pre-wrap;color:var(--ink)}
.sheet .proof{padding:10px 12px;background:var(--paper);border-radius:8px}
.sheet .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px}
.sheet .kv dt{color:var(--muted)} .sheet .kv dd{margin:0;word-break:break-all}
.verdict{border-left:3px solid var(--line-strong);padding:6px 10px;margin:6px 0}
.verdict.accept{border-color:var(--working)} .verdict.reject{border-color:var(--blocked)}

/* ---- dialogs ---- */
.dlg{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:520px;max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:31;padding:20px 22px}
.dlg h3{margin:0 0 4px;font-size:17px;font-weight:600}
.dlg .lede{color:var(--muted);margin:0 0 14px;line-height:1.5}
.dlg label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.dlg input,.dlg textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;background:var(--card);color:var(--ink)}
.dlg textarea{min-height:72px;resize:vertical}
.dlg .shabox{font-family:var(--mono);font-size:12.5px;background:var(--paper);border-radius:8px;padding:8px 10px;word-break:break-all}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.dlg .foot .why{flex:1;color:var(--needs);font-size:13px}
.dlg .seat{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer}
.dlg .seat input{width:auto}
.dlg .seat .st{color:var(--muted);font-size:12.5px;margin-left:auto}
.dlg .seat .st.warn{color:var(--needs)}
.dlg .cmd{display:flex;gap:8px;align-items:center;background:var(--paper);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12.5px;margin-top:8px}
.dlg .cmd span{flex:1}
.dlg .cmd button{all:unset;cursor:pointer;color:var(--accent);font-family:var(--sans);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#262626;color:#fff;padding:10px 14px;border-radius:10px;z-index:40;font-size:13px;max-width:calc(100% - 24px);box-shadow:var(--shadow)}
.toast code{color:#ffd88a;font-size:12px}

/* ---- phone ---- */
.seg{display:none}
@media (max-width:960px){
  .top{padding:0 14px;gap:10px}
  .you{display:none}
  .objective{padding:16px 14px 12px}
  .objective .row{display:block}
  .objective .you-mobile{display:block}
  .progress{min-width:0;text-align:left;margin-top:8px}
  .progress .bar{max-width:220px}
  .layout{display:block;padding:14px 14px 60px}
  .main{max-width:none}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--card)}
  .seg button{all:unset;text-align:center;padding:8px;cursor:pointer;font-weight:500;position:relative}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .seg button .dot{position:absolute;top:8px;margin-left:6px;width:7px;height:7px;border-radius:4px;background:var(--needs)}
  .talk{position:static;max-height:none;min-height:60vh}
  body[data-tab=board] .talk{display:none}
  body[data-tab=talk] .main{display:none}
  .strip{gap:6px}
  .pill{padding:5px 10px 5px 8px;font-size:13px}
  .card{padding:12px 12px}
  .card .head{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .card .id{grid-column:1;grid-row:1}
  .card .open{grid-column:2;grid-row:1;margin:0}
  .card .title{grid-column:1/-1}
  .card .open{margin-left:auto}
  .sheet{width:100%;border-left:0;padding:16px 14px 40px}
  .dlg{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-width:100%;border-radius:14px 14px 0 0}
}
</style>
</head>
<body data-tab="board">

<div class="mock" id="mockbar"><b>Mockup · state</b></div>

<header class="top">
  <span class="wordmark">atman</span>
  <span class="project" title="Project switcher: every board in ~/.config/atman/board.json">demo <span class="chev">▾</span></span>
  <span class="spacer"></span>
  <span class="you" id="you"></span>
  <label class="switch" title="Show paths, transcripts, receipts, limits and phases"><i></i><span id="detailsLabel">Details</span><input type="checkbox" id="detailsToggle" hidden></label>
</header>

<div class="objective" id="objective"></div>

<div class="layout">
  <div class="seg" id="seg">
    <button aria-pressed="true" data-tab="board">Board</button>
    <button aria-pressed="false" data-tab="talk">Talk<span class="dot hidden" id="talkDot"></span></button>
  </div>
  <div class="main" id="main">
    <div class="strip" id="strip"></div>
    <div id="sections"></div>
  </div>
  <aside class="talk" id="talk"></aside>
</div>

<div id="overlay"></div>

<script>
/* =====================================================================
   Sample data. Shapes mirror /api/v1/plan, /api/v1/board, /api/v1/thread
   and /api/v1/needs-you on a quickstart board (project "demo", operator
   "boss", one seat "worker"). Times are relative strings because this is
   a static mockup; the app formats `at` in the viewer's zone.
   ===================================================================== */
const SHA = "3f2a1c0d9e8b7a6f5e4d3c2b1a0f9e8d7c6b5a49";
const OBJ = {text:"Ship a small stats API with a screen on top", exit:"the screen shows live stats from the API, accepted by a second seat"};
const T = {
  t1:{id:"T-001", title:"Sample: design the data model", role:"backend", body:"A sample ticket created by `atm quickstart`.\n\nIt has no dependencies, so it is the one `atm next` hands out first.\nWork it like a real ticket: claim it, post an update, then send it to review."},
  t2:{id:"T-002", title:"Sample: build the API on top of the model", role:"backend", deps:["T-001"], body:"A sample ticket that DEPENDS on the first one.\n\n`atm next` will not offer it until the schema ticket is accepted -- that is the dependency graph doing its job, not the board being empty."},
  t3:{id:"T-003", title:"Sample: put a screen on the API", role:"console", deps:["T-002"], body:"The third sample, two hops down the chain.\n\nRun `atm graph` to see all three and what is blocking what."},
};
const WORKER_DETAILS = "harness cursor · transcript ~/.cursor/sessions/demo-worker.jsonl · wake continuous";
const REVIEW_NOTES = "schema.sql, docs/data-model.md; pytest tests/test_schema.py (6 passed); ids are ULIDs";
function tk(base, o){ return Object.assign({}, base, o); }

const STATES = {
  empty:{
    label:"Empty board", operator:"boss", objective:null, lead:"", tickets:[], needs:[],
    agents:[{name:"worker", state:"offline"}], messages:[]
  },
  fresh:{
    label:"Fresh quickstart", operator:"boss", objective:OBJ, lead:"",
    tickets:[
      tk(T.t1,{phase:"ready"}),
      tk(T.t2,{phase:"waiting", on:"T-001", onState:"open"}),
      tk(T.t3,{phase:"waiting", on:"T-002", onState:"open"}),
    ],
    needs:[], agents:[{name:"worker", state:"idle", since:"1 min"}],
    messages:[
      {from:"worker", at:"9:30 PM", to:"everyone", text:"joined the board; roles=['backend']", receipts:["posted","broadcast"]},
      {from:"boss", at:"9:31 PM", to:"everyone", text:"hi", receipts:["posted"]},
    ]
  },
  working:{
    label:"Working", operator:"boss", objective:OBJ, lead:"",
    tickets:[
      tk(T.t1,{phase:"working", owner:"worker", running:"12 min", evidence:"claimed 12 min ago · run alive · last output 40 s ago"}),
      tk(T.t2,{phase:"waiting", on:"T-001", onState:"open"}),
      tk(T.t3,{phase:"waiting", on:"T-002", onState:"open"}),
    ],
    needs:[], agents:[{name:"worker", state:"working", ticket:"T-001", elapsed:"12 min", usage:"usage 38 %, read 3 min ago"}],
    messages:[
      {from:"worker", at:"9:30 PM", to:"everyone", text:"joined the board; roles=['backend']", receipts:["posted","broadcast"]},
      {from:"boss", at:"9:31 PM", to:"worker", text:"hi", receipts:["posted","inbox read","wake confirmed"]},
      {from:"worker", at:"9:40 PM", to:"boss", re:"T-001", text:"claimed T-001; drafting the schema. Three tables: sites, samples, rollups.", receipts:["posted"]},
    ]
  },
  "needs-you":{
    label:"Needs you", operator:"boss", objective:OBJ, lead:"",
    tickets:[
      tk(T.t1,{phase:"review", owner:"worker", finished:"5 min", sha:SHA, notes:REVIEW_NOTES, branch:"worker/t-001", evidence:"review head submitted 5 min ago · no verdict yet"}),
      tk(T.t2,{phase:"waiting", on:"T-001", onState:"review"}),
      tk(T.t3,{phase:"waiting", on:"T-002", onState:"open"}),
    ],
    needs:[{kind:"question", from:"worker", ago:"20 min", re:"T-001", text:"@boss should ids be ULIDs or auto-increment ints? I used ULIDs; say if you want ints before you accept."}],
    agents:[{name:"worker", state:"idle", since:"5 min", usage:"usage 41 %, read 5 min ago"}],
    messages:[
      {from:"boss", at:"9:31 PM", to:"worker", text:"hi", receipts:["posted","inbox read","wake confirmed"]},
      {from:"worker", at:"9:40 PM", to:"boss", re:"T-001", text:"claimed T-001; drafting the schema. Three tables: sites, samples, rollups.", receipts:["posted","inbox read"]},
      {from:"worker", at:"9:52 PM", to:"boss", re:"T-001", text:"@boss should ids be ULIDs or auto-increment ints? I used ULIDs; say if you want ints before you accept.", receipts:["posted","inbox read"]},
      {from:"worker", at:"10:07 PM", to:"boss", re:"T-001", text:"review: T-001 at 3f2a1c0 — "+REVIEW_NOTES, receipts:["posted","inbox read"]},
    ]
  },
  blocked:{
    label:"Blocked", operator:"boss", objective:OBJ, lead:"",
    tickets:[
      tk(T.t1,{phase:"done", accepted:true, by:"boss", ago:"2 h", sha:SHA, proof:"Accept notes: schema matches the brief; 6 tests pass"}),
      tk(T.t2,{phase:"blocked", owner:"worker", ago:"40 min", reason:"needs staging DB credentials: no STAGING_DB_URL on this machine and I cannot mint one", evidence:"blocked 40 min ago by worker · atm block T-002"}),
      tk(T.t3,{phase:"waiting", on:"T-002", onState:"blocked"}),
    ],
    needs:[{kind:"stuck", from:"worker", ago:"40 min", re:"T-002", text:"needs staging DB credentials: no STAGING_DB_URL on this machine and I cannot mint one"}],
    agents:[{name:"worker", state:"idle", since:"40 min", usage:"usage 52 %, read 40 min ago"}],
    messages:[
      {from:"worker", at:"10:07 PM", to:"boss", re:"T-001", text:"review: T-001 at 3f2a1c0 — "+REVIEW_NOTES, receipts:["posted","inbox read"]},
      {from:"boss", at:"10:12 PM", to:"worker", re:"T-001", text:"accept: schema matches the brief; 6 tests pass", receipts:["posted","inbox read","wake confirmed"]},

/* ===================================================================== */
let S, stateKey = "fresh", talkWith = null, aboutId = "";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = s => s.slice(0,7);
const q = new URLSearchParams(location.search);

function seatState(a){
  if (!a) return "";
  if (a.state === "working") return `running ${a.ticket} for ${a.elapsed}`;
  if (a.state === "idle") return `idle since ${a.since}`;
  if (a.state === "limited") return `limited until ${a.until}`;
  if (a.state === "logged-out") return `logged out · atm harness auth ${a.name}`;
  return "not running";
}

/* one sentence per card (spec §5.3) */
function sentence(t){
  const opIsOwner = t.owner && t.owner === S.operator;
  switch (t.phase){
    case "working": return `${t.owner} has it, running for ${t.running}.`;
    case "claimed": return `${t.owner} has it, last update ${t.ago} ago.`;
    case "review": return opIsOwner ? `You finished it ${t.finished} ago. Another seat has to accept it.` : `${t.owner} finished it ${t.finished} ago. Waiting for your accept.`;
    case "ready": return `Nobody has it. Ready to start.`;
    case "waiting": {
      if (t.onState === "review") return `Nobody has it. Waits on ${t.on}, which is in review.`;
      if (t.onState === "blocked") return `Nobody has it. Waits on ${t.on}, which is blocked.`;
      if (t.onState === "done-unaccepted") return `Waits on ${t.on}, which is done but not accepted.`;
      return `Nobody has it. Waits on ${t.on}.`;
    }
    case "blocked": return `Blocked by ${t.owner} ${t.ago} ago: <q>${esc(t.reason)}</q>`;
    case "limited": return `${t.owner} is limited until ${t.until}. Nothing runs on it until then.`;
    case "offline": return `${t.owner} has no live session. It picks this up when started.`;
    case "done": return t.accepted ? `Accepted by ${t.by} ${t.ago} ago on <code>${short(t.sha)}</code>.` : `Marked done by ${t.owner} ${t.ago} ago. Not accepted yet.`;
  }
  return "";
}
function bucket(t){
  if (t.phase === "review") return "needs";
  if (t.phase === "working" || t.phase === "claimed") return "working";
  if (t.phase === "blocked" || t.phase === "limited" || t.phase === "offline") return "blocked";
  if (t.phase === "done") return "done";
  return "next";
}
function counts(){
  const c = {working:0, needs:0, blocked:0, done:0, unaccepted:0};
  for (const t of S.tickets){
    const b = bucket(t);
    if (b === "working") c.working++;
    if (b === "needs") c.needs++;
    if (b === "blocked") c.blocked++;
    if (b === "done") { if (t.accepted) c.done++; else c.unaccepted++; }
  }
  c.needs += S.needs.length;
  return c;
}
function canAct(){ return !!S.operator; }
function actTitle(){ return canAct() ? "" : "Read-only: start atm ui --operator <name> to act"; }
function btn(label, cls, onclick, opts={}){
  const dis = opts.disabled || !canAct();
  const title = opts.title || (canAct() ? "" : actTitle());
  return `<button class="btn ${cls||""}" ${dis?"disabled":""} title="${esc(title)}" data-act="${onclick}">${label}</button>`;
}

/* ---------- render ---------- */
function render(){
  S = STATES[stateKey];
  document.body.classList.toggle("readonly", !canAct());
  // top bar
  $("#you").innerHTML = canAct() ? `You are <b>${esc(S.operator)}</b>` : `<span class="readonly">Read-only. Start with <code>atm ui --operator &lt;name&gt;</code> to act.</span>`;
  // objective
  const c = counts();
  const total = S.tickets.length;
  const o = $("#objective");
  if (!S.objective){
    o.innerHTML = `<div class="row"><div class="grow"><h1 class="muted" style="font-weight:500">No objective yet. Say what this board is for.</h1>
      <p class="when">${btn("Set objective…","", "set-objective")}</p>
      <p class="you-mobile">${canAct()?`You are <b>${esc(S.operator)}</b>`:"Read-only"}</p></div></div>`;
  } else {
    const pct = total ? Math.round(100*c.done/total) : 0;
    o.innerHTML = `<div class="row"><div class="grow"><h1>${esc(S.objective.text)}</h1>
      <p class="when ${S.objective.exit?"":"warn"}">${S.objective.exit ? "Done when "+esc(S.objective.exit) : 'No "done when" set yet.'}${S.objective.exit?"":'<span class="details inline muted"> · <code>atm objective --exit "…"</code></span>'}</p>
      <p class="you-mobile">${canAct()?`You are <b>${esc(S.operator)}</b>`:"Read-only"}</p></div>
      <div class="progress"><span class="n">${c.done} of ${total} accepted</span>${c.unaccepted?`<span class="muted"> · ${c.unaccepted} done, not accepted</span>`:""}<div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
  }
  // strip
  const pill = (k, n, label) => `<a class="pill ${k} ${n?"":"zero"} ${k==="needs"&&n?"hot":""}" href="#sec-${k}"><i></i>${n} ${label}</a>`;
  $("#strip").innerHTML = pill("working", c.working, "working") + pill("needs", c.needs, "needs you") + pill("blocked", c.blocked, "blocked") + pill("done", c.done, "done");
  $("#talkDot").classList.toggle("hidden", !(S.messages.length && S.messages[S.messages.length-1].from !== S.operator));
  // sections

    secs.innerHTML = `<div class="empty"><span class="grow">This board has no tickets. Add work with <code>atm plan</code> or <code>atm create</code>.</span>${btn("Create ticket…","", "create-ticket")}</div>`;
  } else {
    const by = {needs:[], working:[], blocked:[], next:[], done:[]};
    for (const t of S.tickets) by[bucket(t)].push(t);
    const needsItems = S.needs.map(renderNeed).join("") + by.needs.map(renderCard).join("");
    const nNeeds = S.needs.length + by.needs.length;
    secs.innerHTML =
      section("needs", "Needs you", nNeeds, needsItems, "Nothing needs you right now.") +
      section("working", "Working", by.working.length, by.working.map(renderCard).join(""), "Nobody is working. Assign a ticket or start an agent.", btn("Assign…","", "assign:") + btn("Start an agent…","quiet","start")) +
      section("blocked", "Blocked", by.blocked.length, by.blocked.map(renderCard).join(""), "Nothing is blocked.") +
      section("next", "Up next", by.next.length, by.next.map(renderCard).join(""), "Nothing is queued.") +
      section("done", "Done", by.done.length, by.done.map(renderCard).join(""), "Nothing accepted yet.");
  }
  renderTalk();
  $("#detailsLabel").textContent = document.body.classList.contains("show-details") ? "Details on" : "Details";
  // details block for the board itself
  const boardDetails = $("#boardDetails") || document.createElement("p");
  boardDetails.id = "boardDetails"; boardDetails.className = "details muted"; boardDetails.style.cssText = "margin:-12px 0 20px;font-size:12.5px";
  boardDetails.innerHTML = `Board read 2 s ago · <code>&lt;repo&gt;/.tickets</code> · operator ${esc(S.operator||"none")} · plan generated 2026-09-24T13:35:12Z`;
  $("#sections").before(boardDetails);
}
function section(key, title, n, inner, emptyCopy, emptyActions=""){
  return `<section id="sec-${key}"><h2>${title} <span>(${n})</span></h2>${n ? `<div class="cards">${inner}</div>` : `<div class="empty"><span class="grow">${emptyCopy}</span>${emptyActions}</div>`}</section>`;
}
function renderNeed(n){
  let line, actions;
  if (n.kind === "question"){
    line = `<span class="who">${esc(n.from)}</span> asked ${n.ago} ago about <code>${n.re}</code>: <q>${esc(n.text)}</q>`;
    actions = btn("Answer","primary",`answer:${n.from}:${n.re}`) + btn(`Open ${n.re}`,"quiet",`open:${n.re}`);
  } else if (n.kind === "stuck"){
    line = `<span class="who">${esc(n.from)}</span> has been stuck on <code>${n.re}</code> for ${n.ago}: <q>${esc(n.text)}</q>`;
    actions = btn("Answer","primary",`answer:${n.from}:${n.re}`) + btn("Reassign…","",`assign:${n.re}`) + btn(`Open ${n.re}`,"quiet",`open:${n.re}`);
  } else if (n.kind === "limited"){
    line = `<span class="who">${esc(n.from)}</span> is limited until ${n.until}. <code>${n.re}</code> is waiting on it.`;
    actions = btn("Reassign…","primary",`assign:${n.re}`) + btn("Start another agent…","","start") + btn(`Open ${n.re}`,"quiet",`open:${n.re}`);
  } else if (n.kind === "stopped"){
    line = `<span class="who">${esc(n.from)}</span> stopped ${n.ago} ago. <code>${n.re}</code> is waiting on it.`;
    actions = btn("Start…","primary","start") + btn("Reassign…","",`assign:${n.re}`);
  }
  return `<div class="item"><div class="text">${line}</div><div class="actions">${actions}</div></div>`;
}
function cardActions(t){
  const opIsOwner = t.owner && t.owner === S.operator;
  const owner = t.owner || "";
  switch (bucket(t)){
    case "needs": return btn(`Accept <span class="sha">${short(t.sha)}</span>`, "primary", `accept:${t.id}`, opIsOwner ? {disabled:true, title:"You submitted this, so you cannot accept it."} : {}) + btn("Reject…","danger",`reject:${t.id}`, opIsOwner?{disabled:true,title:"You submitted this; another seat rejects or accepts it."}:{}) + btn("Message","",`message:${owner}:${t.id}`);
    case "working": return btn("Message","",`message:${owner}:${t.id}`);
    case "blocked": return t.phase === "blocked"
      ? btn("Answer","primary",`answer:${owner}:${t.id}`) + btn("Reassign…","",`assign:${t.id}`)
      : btn("Reassign…","primary",`assign:${t.id}`) + btn("Message","",`message:${owner}:${t.id}`);
    case "next": return btn("Assign…","",`assign:${t.id}`) + btn("Message","quiet",`message::${t.id}`);
    case "done": return t.accepted ? "" : btn("Open","quiet",`open:${t.id}`);
  }
  return "";
}
function cardDetails(t){
  const bits = [];
  if (t.evidence) bits.push(`phase ${t.phase} · ${esc(t.evidence)}`);
  if (t.sha) bits.push(`review head <code>${t.sha}</code>${t.branch?` · branch <code>${esc(t.branch)}</code>`:""}`);
  if (t.sha) bits.push(`diff: <code>git diff main...${short(t.sha)}</code> · copy and run it in the repo; the app never runs git on a read`);
  if (t.on) bits.push(`waits on ${t.on} · <code>atm show ${t.on}</code>`);
  bits.push(`<code>atm show ${t.id}</code>`);
  return `<div class="details">${bits.join("<br>")}</div>`;
}
function renderCard(t){
  const b = bucket(t);
  const sub = b === "needs" ? `<p class="sub">Review head <code>${short(t.sha)}</code> · ${esc(t.notes)}</p>` :
              (b === "done" && t.accepted) ? `<p class="sub">Proof · ${esc(t.proof)}</p>` : "";
  const acts = cardActions(t);
  return `<div class="card ${b}" data-id="${t.id}">
    <div class="head"><span class="id">${t.id}</span><span class="title"><button data-act="open:${t.id}">${esc(t.title)}</button></span><button class="open" data-act="open:${t.id}">Open ›</button></div>
    <p class="sentence">${sentence(t)}</p>${sub}
    ${acts?`<div class="actions">${acts}</div>`:""}
    ${cardDetails(t)}
  </div>`;
}

/* ---------- talk ---------- */
function defaultTalk(){
  if (S.lead) return S.lead;
  const running = S.agents.filter(a => a.state === "working");
  if (running.length === 1) return running[0].name;
  return "everyone";
}
function renderTalk(){
  if (talkWith === null) talkWith = defaultTalk();
  const a = S.agents.find(x => x.name === talkWith);
  const everyone = talkWith === "everyone";
  const opts = [`<option value="everyone" ${everyone?"selected":""}>Everyone on the board</option>`]
    .concat(S.agents.map(x => `<option value="${x.name}" ${x.name===talkWith?"selected":""}>${x.name} · ${seatState(x)}</option>`)).join("");
  let state = "", note = "";
  if (everyone){
    state = `<div class="state">No agent is running. Messages land on the board; the next agent that wakes reads them.</div>`;
    const anyRunning = S.agents.some(x => x.state === "working");
    if (anyRunning) state = `<div class="state">Posts to every seat on this board.</div>`;
    else note = `<div class="note">Nothing is running on this board.${btn("Start an agent…","", "start")}</div>`;
  } else if (a){
    const cls = a.state === "working" ? "on" : (a.state === "limited" || a.state === "logged-out" ? "warn" : "");
    state = `<div class="state ${cls}">${seatState(a)}</div>`;
    if (a.state === "limited") note = `<div class="note">${a.name} is limited until ${a.until}. Your message is kept; it reads it when the limit lifts.<br>${btn("Reassign its work…","", "assign:"+(a.ticket||S.tickets.find(t=>t.owner===a.name)?.id||""))}</div>`;
    else if (a.state !== "working") note = `<div class="note">${a.name} is not running. Your message is kept; it reads it when it starts.${btn("Start an agent…","", "start")}</div>`;
  }
  const msgs = S.messages.filter(m => everyone ? true : (m.from === talkWith || m.to === talkWith));
  const thread = msgs.length ? msgs.map(m => `<div class="msg ${m.from===S.operator?"me":""}">
      <div class="meta"><b>${esc(m.from)}</b><span>${m.at}</span>${m.re?`<span class="re">${m.re}</span>`:""}${m.to==="everyone"?`<span>to everyone</span>`:""}</div>
      <p class="body">${esc(m.text)}</p>
      <div class="receipts details">${m.receipts.map(r=>`<span>${r}</span>`).join("")}<span class="details inline">harness ${m.from==="worker"?"cursor":"—"}</span> <button class="btn quiet" style="height:22px;padding:0 6px;font-size:12px" data-act="copy">Copy</button></div>
    </div>`).join("") : `<div class="empty-t">No messages with ${everyone?"the board":talkWith} yet.</div>`;
  const aboutOpts = [`<option value="">about nothing</option>`].concat(S.tickets.map(t => `<option value="${t.id}" ${t.id===aboutId?"selected":""}>about ${t.id}</option>`)).join("");
  $("#talk").innerHTML = `<div class="th"><div class="label">Talk to</div>
      <div class="who"><select id="talkWith" title="Who you are talking to. Never picked for you unless a single agent is running.">${opts}</select></div>${state}${note}
      <div class="details muted" style="margin-top:8px;font-size:12.5px">${a ? `${esc(a.usage||"usage not read")} · auth checked 1 h ago · ${WORKER_DETAILS}` : "board thread is broadcast"}</div></div>
    <div class="thread" id="thread">${thread}</div>
    <div class="composer"><textarea id="composer" placeholder="Message ${everyone?"everyone":talkWith}…" ${canAct()?"":"disabled"}></textarea>
      <div class="row"><select id="about">${aboutOpts}</select><span class="grow"></span>${btn("Send","primary","send")}</div></div>`;
  $("#talkWith").onchange = e => { talkWith = e.target.value; renderTalk(); };
  $("#about").onchange = e => { aboutId = e.target.value; };
  const th = $("#thread"); th.scrollTop = th.scrollHeight;
}

/* ---------- sheet + dialogs ---------- */

function closeOverlay(){ $("#overlay").innerHTML = ""; }

function openAssign(id){
  const t = ticket(id);
  const seats = S.agents.map((a,i) => { const warn = a.state==="limited"||a.state==="logged-out"||a.state==="offline"; return `<label class="seat"><input type="radio" name="seat" value="${a.name}"><span>${a.name}</span><span class="st ${warn?"warn":""}">${seatState(a)}${warn?" · will not start until then":""}</span></label>`; }).join("");
  dialog(`<h3>${t&&t.owner?"Reassign":"Assign"} ${id||"a ticket"}</h3><p class="lede">${t?esc(t.title)+". ":""}Claims it on the seat's behalf. Nothing is picked for you.</p>
    ${id?"":`<label>Ticket</label><select id="assignTicket" style="width:100%;font:inherit;padding:8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--ink)">${S.tickets.filter(x=>bucket(x)==="next").map(x=>`<option value="${x.id}">${x.id} · ${esc(x.title)}</option>`).join("")}</select>`}
    <label>Seat</label>${seats}
    <label>Why (optional)</label><input id="assignWhy" placeholder="Appended to the ticket's note">
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="do-assign:${id}">Assign</button></div>
    <p class="details muted" style="margin:12px 0 0;font-size:12px">POST /api/v1/ticket/${id||"<id>"}/assign {owner, notes} · <code>atm assign ${id||"<id>"} --owner &lt;seat&gt; --notes "…"</code></p>`);
}
function openStart(){
  dialog(`<h3>Start an agent</h3><p class="lede">Runs a harness on your machine with your credentials, so the app does not start it for you. Paste this in a terminal.</p>
    <label>Seat</label><p style="margin:0">worker · cursor (as registered with <code>atm join</code>)</p>
    <div class="cmd"><span>atm spawn worker --persist</span><button data-act="copy">Copy</button></div>
    <div class="foot"><button class="btn" data-act="close">Done</button></div>`);
}
function openSetObjective(){
  dialog(`<h3>Set the objective</h3><p class="lede">One sentence for what this board is for, and how you will know it is done.</p>
    <label>Objective</label><input placeholder="Ship a small stats API with a screen on top">
    <label>Done when</label><input placeholder="the screen shows live stats from the API, accepted by a second seat">
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="do-objective">Set objective</button></div>
    <p class="details muted" style="margin:12px 0 0;font-size:12px">POST /api/v1/objective · <code>atm objective --set "…" --exit "…"</code></p>`);
}
function openCreate(){
  dialog(`<h3>Create a ticket</h3><label>Title</label><input placeholder="What has to be true when this is done">
    <label>Role</label><input placeholder="backend">
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="do-create">Create</button></div>
    <p class="details muted" style="margin:12px 0 0;font-size:12px">POST /api/v1/ticket · <code>atm create "…" --role backend</code></p>`);
}
let toastTimer;
function toast(html){
  let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.innerHTML = html; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}
function focusComposer(to, re){
  talkWith = to || "everyone"; aboutId = re || ""; document.body.dataset.tab = "talk"; syncSeg();
  renderTalk(); setTimeout(() => $("#composer")?.focus(), 30);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const [act, a1, a2] = el.dataset.act.split(":");
  switch (act){
    case "open": openSheet(a1); break;
    case "close": closeOverlay(); break;
    case "accept": openAccept(a1); break;
    case "reject": openReject(a1); break;
    case "assign": openAssign(a1); break;
    case "start": openStart(); break;
    case "set-objective": openSetObjective(); break;
    case "create-ticket": openCreate(); break;
    case "message": closeOverlay(); focusComposer(a1, a2); break;
    case "answer": closeOverlay(); focusComposer(a1, a2); break;
    case "send": { const txt = $("#composer").value.trim(); if (!txt){ $("#composer").focus(); return; } toast(`Mockup: would <code>POST /msg</code> as ${esc(S.operator)} to ${esc(talkWith)}${aboutId?" re "+aboutId:""} (<code>atm msg --to ${esc(talkWith==="everyone"?"everyone":talkWith)}${aboutId?" --re "+aboutId:""} "…"</code>)`); $("#composer").value = ""; break; }
    case "do-accept": { const t = ticket(a1); const n = $("#acceptNotes").value.trim(); if (!n){ $("#acceptNotes").focus(); return; } closeOverlay(); toast(`Mockup: would <code>POST /api/v1/ticket/${a1}/accept</code> {sha: ${short(t.sha)}…, notes} · gate: operator ≠ author, sha = submitted head`); break; }
    case "do-reject": { const r = $("#rejectReason").value.trim(); if (!r){ $("#rejectReason").focus(); return; } closeOverlay(); toast(`Mockup: would <code>POST /api/v1/ticket/${a1}/reject</code> {sha, reason} · returns ${a1} to its author as claimed`); break; }
    case "do-assign": { const seat = document.querySelector('input[name=seat]:checked')?.value; if (!seat){ toast("Pick a seat first. The app never picks one for you."); return; } const id = a1 || $("#assignTicket")?.value; closeOverlay(); toast(`Mockup: would <code>POST /api/v1/ticket/${id}/assign</code> {owner: ${seat}} (<code>atm assign ${id} --owner ${seat}</code>)`); break; }
    case "do-objective": closeOverlay(); toast(`Mockup: would <code>POST /api/v1/objective</code> (<code>atm objective --set … --exit …</code>)`); break;
    case "do-create": closeOverlay(); toast(`Mockup: would <code>POST /api/v1/ticket</code> (<code>atm create …</code>)`); break;
    case "copy": toast("Copied."); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlay(); });
$("#detailsToggle").addEventListener("change", e => { document.body.classList.toggle("show-details", e.target.checked); $("#detailsLabel").textContent = e.target.checked ? "Details on" : "Details"; });
function syncSeg(){ for (const b of $("#seg").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.tab === document.body.dataset.tab)); }
$("#seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; document.body.dataset.tab = b.dataset.tab; syncSeg(); });

/* ---------- mock state bar ---------- */
const bar = $("#mockbar");
for (const [k, v] of Object.entries(STATES)){
  const b = document.createElement("button"); b.textContent = v.label; b.dataset.state = k;
  b.onclick = () => setState(k); bar.appendChild(b);
}
function setState(k){
  stateKey = k; talkWith = null; aboutId = ""; closeOverlay();
  for (const b of bar.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.state === k));
  render();
  history.replaceState(null, "", "?state=" + k + (document.body.classList.contains("show-details") ? "&details=1" : "") + (document.body.dataset.tab==="talk"?"&tab=talk":""));
}
if (q.get("details") === "1"){ document.body.classList.add("show-details"); $("#detailsToggle").checked = true; }
if (q.get("tab") === "talk"){ document.body.dataset.tab = "talk"; syncSeg(); }
if (q.get("bare") === "1") bar.classList.add("hidden");
setState(STATES[q.get("state")] ? q.get("state") : "fresh");
if (q.get("open")) openSheet(q.get("open"));
if (q.get("dialog") === "accept") openAccept(q.get("open") || "T-001");
if (q.get("dialog") === "reject") openReject(q.get("open") || "T-001");
if (q.get("dialog") === "assign") openAssign(q.get("open") || "");
if (q.get("dialog") === "start") openStart();
</script>
</body>
</html>
